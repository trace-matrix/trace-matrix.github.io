<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="grid-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- Matrix Grid Icon with shadow -->
  <g filter="url(#glow)" stroke="url(#grid-stroke)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer boundary of grid -->
    <rect x="14" y="14" width="36" height="36" rx="5"/>
    <!-- Internal horizontal lines -->
    <line x1="14" y1="26" x2="50" y2="26"/>
    <line x1="14" y1="38" x2="50" y2="38"/>
    <!-- Internal vertical lines -->
    <line x1="26" y1="14" x2="26" y2="50"/>
    <line x1="38" y1="14" x2="38" y2="50"/>
  </g>

  <!-- Highlight accent in the center cell -->
  <rect x="28" y="28" width="8" height="8" rx="1.5" fill="#38bdf8"/>
</svg>
